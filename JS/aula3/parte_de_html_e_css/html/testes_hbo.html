<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">  
   <title>HBO - Filmes e Séries Online</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                        url(''); 
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        #heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            height: 60px;
        }

        #logo {
            height: 30px;
            width: auto;
            display: block;
        }

        #content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .minha-caixa {
            background-color: #000000d7; 
            border-radius: 4px;        
            padding: 8px 16px;         
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .minha-caixa:hover {
            background-color: rgba(108, 108, 108, 0.659);
        }

        .minha-caixa a {
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .minha-caixa2{
            background-color: #ffffffd7; 
            border-radius: 4px;        
            padding: 8px 16px;         
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }
         .minha-caixa2 a {
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            color: rgb(0, 0, 0);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
         .minha-caixa2:hover {
            background-color: rgba(169, 167, 167, 0.823);
        }
    </style>
</head>

<body>
    <header id="heading">
        <a href="#">
            <img id="logo" src="https://www.hbomax.com/img/hbomax/logo_nav_bar.png" alt="HBO Max Logo">
        </a>
        <div id="content">
            <div class="minha-caixa">
                <a href="#">Entrar</a>
            </div>
            <div class="minha-caixa2">
                <a href="#">Assine agora</a>
            </div>
        </div> 
    </header>
</body>
</html>
